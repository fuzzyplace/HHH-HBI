<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HHH Human Brain Interface</title>
<link rel="stylesheet" href="/src/style.css">
</head><body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row">
    <b class="glitch" data-t="HHH//HBI">HHH//HBI</b><span id="status">SIM</span><span id="bpm">♥ --</span><span id="batt">🔋 --</span>
  </div>
  <div id="sq" class="row"></div>
  <div id="bars"></div>
  <div class="row btns">
    <button id="connect">Connect Muse 2</button>
    <button id="audio">Start Audio</button>
    <button id="mode">Mode: PARTICLES</button>
    <button id="snap">Snapshot (S)</button>
    <button id="calib">Calibrate (C)</button>
    <button id="clear">Clear</button>
    <button id="hide">Hide HUD (H)</button>
  </div>
  <div class="row btns" id="simbtns">
    <span>SIM:</span>
    <button data-m="auto">Auto</button><button data-m="calm">Calm</button><button data-m="focus">Focus</button><button data-m="drift">Drift</button>
  </div>
  <div id="msg"></div>
</div>
<div id="calov" hidden>
  <div class="calbox">
    <b>BASELINE</b>
    <p id="caltxt">Sit still, relax your jaw, close your eyes and breathe slowly.</p>
    <div class="calbar"><i id="calfill"></i></div>
    <p class="dim" id="calsub">Only clean signal counts — blinks and movement pause the timer.</p>
    <button id="calcancel">Cancel (Esc)</button>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body></html>
